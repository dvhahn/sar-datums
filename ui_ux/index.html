<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SAR Datums</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.1.1/dist/maplibre-gl.css">
  <script src="https://unpkg.com/maplibre-gl@4.1.1/dist/maplibre-gl.js"></script>
</head>
<body>

  <main id="map" aria-label="Drift prediction map"></main>

  <header class="top-bar">
    <div class="brand-pill">
      <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10"/>
        <circle cx="12" cy="12" r="3" fill="currentColor" opacity="0.5"/>
        <line x1="12" y1="2"  x2="12" y2="6"/>
        <line x1="12" y1="18" x2="12" y2="22"/>
        <line x1="2"  y1="12" x2="6"  y2="12"/>
        <line x1="18" y1="12" x2="22" y2="12"/>
      </svg>
      <h1 class="brand-name">SAR <span>Datums</span></h1>
    </div>

    <div class="status-pill">
      <span class="status-dot"></span>
      Hauraki Gulf
    </div>

    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4"/>
        <line x1="12" y1="2"  x2="12" y2="4"/>
        <line x1="12" y1="20" x2="12" y2="22"/>
        <line x1="2"  y1="12" x2="4"  y2="12"/>
        <line x1="20" y1="12" x2="22" y2="12"/>
        <line x1="4.9" y1="4.9"  x2="6.3"  y2="6.3"/>
        <line x1="17.7" y1="17.7" x2="19.1" y2="19.1"/>
        <line x1="4.9"  y1="19.1" x2="6.3"  y2="17.7"/>
        <line x1="17.7" y1="6.3"  x2="19.1" y2="4.9"/>
      </svg>
    </button>
  </header>

  <div class="result-pills" id="resultPills"></div>

  <div class="fab-anchor" id="fabAnchor" aria-hidden="true">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round">
      <line x1="6"  y1="6"  x2="18" y2="18"/>
      <line x1="18" y1="6"  x2="6"  y2="18"/>
    </svg>
  </div>

  <button class="fab hidden" id="fab" aria-label="New calculation">
    <svg class="fab-icon fab-icon-plus" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
      <line x1="12" y1="5"  x2="12" y2="19"/>
      <line x1="5"  y1="12" x2="19" y2="12"/>
    </svg>
    <svg class="fab-icon fab-icon-target" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-linecap="round">
      <circle class="reticle-ring" cx="12" cy="12" r="5.5" stroke-width="1" opacity="0.45"/>
      <line class="reticle-tick" x1="12" y1="2"  x2="12" y2="5.5" stroke-width="1.75"/>
      <line class="reticle-tick" x1="12" y1="18.5" x2="12" y2="22" stroke-width="1.75"/>
      <line class="reticle-tick" x1="2"  y1="12" x2="5.5"  y2="12" stroke-width="1.75"/>
      <line class="reticle-tick" x1="18.5" y1="12" x2="22" y2="12" stroke-width="1.75"/>
      <circle class="reticle-dot" cx="12" cy="12" r="1.75" fill="currentColor" stroke="none"/>
    </svg>
  </button>

  <div class="drag-coord" id="dragCoord"></div>

  <div class="card-wrap" id="cardWrap">
    <div class="card-backdrop"></div>
    <div class="card" role="dialog" aria-labelledby="cardTitle">
      <div class="card-header">
        <h2 class="card-title" id="cardTitle">New <span>Drift Calculation</span></h2>
        <button class="card-close" aria-label="Close">×</button>
      </div>

      <form class="card-form">
        <section class="form-section">
          <div class="form-label">Position</div>
          <div class="form-row">
            <label class="field">
              <span>Lat</span>
              <input type="number" id="inpLat" value="-36.8" step="0.000001">
            </label>
            <label class="field">
              <span>Lon</span>
              <input type="number" id="inpLon" value="174.8" step="0.000001">
            </label>
          </div>
        </section>

        <section class="form-section">
          <div class="form-label">Time</div>
          <div class="form-row">
            <label class="field">
              <span>Start</span>
              <input type="datetime-local" id="inpStart">
            </label>
            <label class="field">
              <span>End</span>
              <input type="datetime-local" id="inpEnd">
            </label>
          </div>
        </section>

        <section class="form-section">
          <div class="form-label">Wind</div>
          <div class="form-row">
            <label class="field">
              <span>Speed (kts)</span>
              <input type="number" id="inpWindSpeed" value="15" min="0" max="200">
            </label>
            <label class="field">
              <span>Direction (°)</span>
              <input type="number" id="inpWindDir" value="180" min="0" max="359">
            </label>
          </div>
        </section>

        <section class="form-section">
          <div class="form-label">Object</div>
          <label class="field">
            <select id="inpObject"></select>
          </label>
        </section>

        <div class="toggle-row">
          <span>Reverse track</span>
          <label class="toggle">
            <input type="checkbox" id="inpReverse">
            <span class="toggle-slider"></span>
          </label>
        </div>

        <div class="form-error hidden" id="formError" role="alert"></div>

        <button type="button" class="btn-primary" id="btnCalculate">Calculate Datum</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
